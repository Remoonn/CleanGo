<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - CleanGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .dashboard {
      text-align: center;
      max-width: 500px;
      padding: 48px 40px;
      background: rgba(255,255,255,0.05);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #10b981, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      border: 3px solid rgba(16, 185, 129, 0.3);
      overflow: hidden;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .welcome {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f1f5f9;
    }
    .user-email {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .provider-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 32px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .provider-google {
      background: rgba(66, 133, 244, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(66, 133, 244, 0.2);
    }
    .provider-email {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .success-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .message {
      color: #cbd5e1;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-logout {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 32px;
      border: 1.5px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="dashboard" id="dashboard">
    <div class="success-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    </div>
    <div class="avatar" id="avatar"></div>
    <h1 class="welcome" id="welcomeText">Loading...</h1>
    <p class="user-email" id="userEmail"></p>
    <div id="providerBadge"></div>
    <p class="message">Anda berhasil masuk ke CleanGo. Halaman dashboard sedang dalam pengembangan.</p>
    <a href="/auth/logout" class="btn-logout">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Keluar
    </a>
  </div>

  <script>
    fetch('/api/user')
      .then(res => {
        if (!res.ok) throw new Error('Unauthorized');
        return res.json();
      })
      .then(user => {
        document.getElementById('welcomeText').textContent = `Halo, ${user.displayName}!`;
        document.getElementById('userEmail').textContent = user.email;
        
        const avatar = document.getElementById('avatar');
        if (user.photo) {
          avatar.innerHTML = `<img src="${user.photo}" alt="Profile">`;
        } else {
          avatar.textContent = user.displayName.charAt(0).toUpperCase();
        }

        const badge = document.getElementById('providerBadge');
        if (user.provider === 'google') {
          badge.innerHTML = '<span class="provider-badge provider-google">🔵 Google Account</span>';
        } else {
          badge.innerHTML = '<span class="provider-badge provider-email">📧 Email Login</span>';
        }
      })
      .catch(() => {
        window.location.href = '/login';
      });
  </script>
</body>
</html>
